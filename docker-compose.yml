name: wagering-processor

# Três instâncias idênticas da aplicação (API + workers) disputando o mesmo
# PostgreSQL e a mesma fila — a correção não depende de haver uma só.
x-app: &app
  build: .
  image: wagering-processor:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &app-env
    APP_ROLE: all
    PORT: '3000'
    DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://sqs:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    LOG_LEVEL: info
  healthcheck:
    test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  depends_on:
    bootstrap:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
    command: ['postgres', '-c', 'max_connections=300']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  # MiniStack: emulador AWS compatível com a API do SQS (inclusive FIFO),
  # usado no lugar do LocalStack porque a imagem atual do LocalStack exige token.
  sqs:
    image: ministackorg/ministack:1.5.38
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', "python -c \"import urllib.request as r; r.urlopen('http://localhost:4566/_ministack/health')\" || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: aplica migrations e cria filas. As instâncias só sobem depois.
  bootstrap:
    build: .
    image: wagering-processor:local
    environment: *app-env
    command: ['sh', '-c', 'bun src/cli/migrate.ts up && bun src/cli/setup-queues.ts']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy

  app-1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
    ports: ['3001:3000']
  app-2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
    ports: ['3002:3000']
  app-3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
    ports: ['3003:3000']

volumes:
  pgdata:
